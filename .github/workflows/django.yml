name: AHC CI|CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least-privilege default; publish/bump declare their own broader permissions below.
permissions:
  contents: read

# Serializes the whole test -> lint -> manifests -> publish -> bump chain per
# ref, not just the bump job. Without this, two pushes to main can race:
# if commit A's pipeline starts first but commit B's finishes publish first,
# job-level concurrency on bump alone would still process B's bump before
# A's, letting A's bump overwrite B's newer image tag — an unintended
# GitOps rollback. Keying by ref keeps PRs on different branches from
# blocking each other.
#
# GitHub does not guarantee strict FIFO ordering across every trigger in a
# concurrency group: with cancel-in-progress: false, the currently running
# workflow is protected, but only the single most recently queued run is
# kept — an older *queued* run is cancelled outright when a newer one
# arrives, rather than waiting its turn. For this race that is actually the
# property we want: a stale intermediate push never runs its bump after a
# newer one, it just never runs at all.
concurrency:
  group: ahc-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        # SHA-pinned to v10.1.0; the trailing comment only labels the SHA, it isn't the pin.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: ty check
        run: uv run ty check

      - name: Codespell
        run: uv run codespell

  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
      FLOWER_PORT: ${{ secrets.FLOWER_PORT }}
      FLOWER_BASIC_AUTH: ${{ secrets.FLOWER_BASIC_AUTH }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      COUCHDB_USER: ${{ secrets.COUCHDB_USER }}
      COUCHDB_PASSWORD: ${{ secrets.COUCHDB_PASSWORD }}
      COUCHDB_PORT: ${{ secrets.COUCHDB_PORT }}
      COUCH_CONNECTOR: ${{ secrets.COUCH_CONNECTOR }}
      CELERY_BACKEND: ${{ secrets.CELERY_BACKEND }}
      EMAIL_BACKEND: ${{ secrets.EMAIL_BACKEND }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        # SHA-pinned to v10.1.0; the trailing comment only labels the SHA, it isn't the pin.
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run tests (Django runner)
        run: PYTHONPATH=src uv run python manage.py test

      - name: Run tests (pytest)
        run: uv run pytest -m "not slow"

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_VERSION: "5.8.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned kustomize (checksum-verified)
        env:
          # sha256 for kustomize_v5.8.1_linux_amd64.tar.gz, per the release's checksums.txt.
          KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
        run: |
          curl -fsSL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar xz -C /usr/local/bin -f kustomize.tar.gz kustomize
          rm kustomize.tar.gz
          kustomize version

      - name: Render base
        run: kustomize build kubernetes/base > /tmp/base.yaml

      - name: Render ArgoCD test overlay
        run: kustomize build kubernetes/overlays/minikube-argocd > /tmp/minikube-argocd.yaml

      - name: Render AWS overlay
        run: kustomize build kubernetes/overlays/aws > /tmp/aws.yaml

      # overlays/home joins once its sealed/ files exist (requires the home
      # cluster's sealed-secrets controller key).

      - name: Assert sync-wave present on SealedSecrets
        run: |
          python3 - <<'EOF'
          import sys, yaml
          docs = list(yaml.safe_load_all(open("/tmp/minikube-argocd.yaml")))
          sealed = [d for d in docs if d and d.get("kind") == "SealedSecret"]
          assert sealed, "no SealedSecrets rendered"
          for d in sealed:
              wave = d["metadata"].get("annotations", {}).get("argocd.argoproj.io/sync-wave")
              assert wave == "-3", f"{d['metadata']['name']}: sync-wave={wave!r}, expected '-3'"
          print(f"OK: {len(sealed)} SealedSecrets at wave -3")
          EOF

      - name: Assert AWS overlay rehearsal invariants
        run: |
          python3 - <<'EOF'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/aws.yaml")) if d]

          def ann(d):
              return d["metadata"].get("annotations", {}) or {}

          sealed = [d for d in docs if d.get("kind") == "SealedSecret"]
          assert len(sealed) == 4, f"expected 4 SealedSecrets, got {len(sealed)}"
          for d in sealed:
              wave = ann(d).get("argocd.argoproj.io/sync-wave")
              assert wave == "-3", f"{d['metadata']['name']}: sync-wave={wave!r}, expected '-3'"

          pvcs = {d["metadata"]["name"]: d for d in docs if d.get("kind") == "PersistentVolumeClaim"}
          for name in ("app-media-pvc", "app-private-pvc"):
              wave = ann(pvcs[name]).get("argocd.argoproj.io/sync-wave")
              assert wave == "0", f"{name}: sync-wave={wave!r}, expected '0' (gp3 WaitForFirstConsumer)"
              opts = ann(pvcs[name]).get("argocd.argoproj.io/sync-options", "")
              assert "Prune=false" in opts and "Delete=false" in opts, f"{name}: lost sync-options ({opts!r})"

          def colocation_term(t):
              if t.get("topologyKey") != "kubernetes.io/hostname":
                  return False
              exprs = t.get("labelSelector", {}).get("matchExpressions", [])
              return any(
                  e.get("key") == "colocation-group"
                  and e.get("operator") == "In"
                  and "app-private-rwo" in e.get("values", [])
                  for e in exprs
              )

          workloads = {d["metadata"]["name"]: d for d in docs if d.get("kind") in ("Deployment", "StatefulSet")}
          for name in ("ahc-app-backend", "celery-worker"):
              tpl = workloads[name]["spec"]["template"]
              labels = tpl["metadata"].get("labels", {})
              assert labels.get("colocation-group") == "app-private-rwo", f"{name}: missing colocation-group label"
              pod_aff = tpl["spec"].get("affinity", {}).get("podAffinity", {})
              terms = pod_aff.get("requiredDuringSchedulingIgnoredDuringExecution", [])
              assert any(colocation_term(t) for t in terms), \
                  f"{name}: no required colocation-group podAffinity term on kubernetes.io/hostname"

          for d in docs:
              if d.get("kind") not in ("Deployment", "StatefulSet", "Job", "CronJob"):
                  continue
              spec = d["spec"]["template"]["spec"] if d["kind"] != "CronJob" else d["spec"]["jobTemplate"]["spec"]["template"]["spec"]
              assert "nodeName" not in spec, f"{d['metadata']['name']}: hardcoded nodeName"
              ns = spec.get("nodeSelector") or {}
              assert "kubernetes.io/hostname" not in ns, f"{d['metadata']['name']}: hardcoded hostname nodeSelector"

          print("OK: AWS overlay sync-waves, co-location affinity, and no node pinning")
          EOF

      - name: Assert AWS deploy stays manual (cost guardrail)
        run: |
          python3 - <<'EOF'
          import re, yaml

          # ahc-aws must never gain an automated sync policy: the EKS target is
          # ephemeral and cost-bearing (see README "AWS safety contract").
          app = yaml.safe_load(open("argocd/ahc-aws.yaml"))
          sync_policy = (app.get("spec") or {}).get("syncPolicy") or {}
          assert "automated" not in sync_policy, \
              "argocd/ahc-aws.yaml has spec.syncPolicy.automated -- AWS deploy must stay manual"

          # ...and this workflow must not itself mutate AWS or bump the aws overlay.
          wf = yaml.safe_load(open(".github/workflows/django.yml"))
          jobs = wf.get("jobs", {})

          def run_scripts(job):
              for step in job.get("steps", []):
                  if step.get("run"):
                      yield step.get("name", "<unnamed>"), step["run"]

          def code_lines(script):
              # strip comments so a clarifying "# ...terraform apply" line can't trip the check
              for line in script.splitlines():
                  s = line.split(" #", 1)[0].strip()
                  if s and not s.startswith("#"):
                      yield s

          # terraform apply/destroy in command position; anchored so this step's own source can't self-match
          forbidden = re.compile(r"^(cd\s+\S+\s*(&&|;)\s*)?terraform\b[^#]*\b(apply|destroy)\b")
          for jname, job in jobs.items():
              for sname, script in run_scripts(job):
                  for line in code_lines(script):
                      assert not forbidden.match(line), \
                          f"{jname}/{sname}: workflow runs a terraform apply/destroy -- forbidden"

          for sname, script in run_scripts(jobs.get("bump", {})):
              assert "overlays/aws" not in script, \
                  f"bump/{sname}: bump job touches overlays/aws -- bump is home-only"

          print("OK: ahc-aws manual-sync-only; no terraform apply/destroy in workflow; bump is home-only")
          EOF

      # Terraform is validated separately below — it needs neither AWS
      # credentials nor sealed secrets.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform -chdir=terraform/aws fmt -check -recursive

      - name: Terraform init (no backend, no cloud credentials needed)
        # -lockfile=readonly: fail instead of silently re-resolving provider versions.
        run: terraform -chdir=terraform/aws init -backend=false -lockfile=readonly

      - name: Terraform validate
        run: terraform -chdir=terraform/aws validate

  compose-validate:
    name: Validate production Compose stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render combined Compose config
        # Fictitious values only; catches broken YAML/interpolation before merge, no daemon needed.
        env:
          AHC_DOMAIN: "ahc.example.test"
          APP_IMAGE_TAG: "sha-0000000000000000000000000000000000000000"
          POSTGRES_DB: "ahc_test"
          POSTGRES_USER: "ahc_test"
          POSTGRES_PASSWORD: "test-password"
          COUCHDB_USER: "ahc_test"
          COUCHDB_PASSWORD: "test-password"
          COUCHDB_PORT: "5982"
          CELERY_BROKER_URL: "redis://redis:6379/0"
          FLOWER_PORT: "5555"
          FLOWER_BASIC_AUTH: "test:test-password"
          DB_VOLUMEN_POSTGRES: "/tmp/ahc-ci-fake/postgres"
          DB_VOLUMEN_COUCH: "/tmp/ahc-ci-fake/couchdb"
          VOLUMEN_PRIVATE_STORAGE: "/tmp/ahc-ci-fake/private"
        run: |
          mkdir -p /tmp/ahc-ci-fake/postgres /tmp/ahc-ci-fake/couchdb /tmp/ahc-ci-fake/private
          # web/queue/celery_beat load env_file: ../.env; a real checkout has none.
          touch .env
          docker compose \
            -f docker/docker-compose-traefik.yml \
            -f docker/docker-compose.cd.yml \
            config

  build-validate:
    name: Build ahc-app image (validation only, no push)
    runs-on: ubuntu-latest
    # publish (below) already builds+pushes on push/dispatch; this just gives PRs a build signal.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ahc-app (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile-app
          push: false

  publish:
    name: Publish app image to GHCR
    runs-on: ubuntu-latest
    needs: [test, lint, manifests]
    # workflow_dispatch allows publishing a sha- tag from a feature branch
    # (e.g. to test the branch on minikube before merge).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set image tags
        # The prod tag moves ONLY on main: Watchtower deploys whatever prod
        # points at, so a branch dispatch must never touch it.
        run: |
          TAGS="ghcr.io/${OWNER}/ahc-app:sha-${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},ghcr.io/${OWNER}/ahc-app:prod"
          fi
          echo "TAGS=${TAGS}" >> $GITHUB_ENV

      - name: Build and push ahc-app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile-app
          push: true
          tags: ${{ env.TAGS }}

  bump:
    name: Bump image tag in home overlay
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      KUSTOMIZE_VERSION: "5.8.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install pinned kustomize (checksum-verified)
        env:
          # sha256 for kustomize_v5.8.1_linux_amd64.tar.gz, per the release's checksums.txt.
          KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
        run: |
          curl -fsSL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar xz -C /usr/local/bin -f kustomize.tar.gz kustomize
          rm kustomize.tar.gz
          kustomize version

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set image tag in home overlay
        run: |
          cd kubernetes/overlays/home
          kustomize edit set image "ghcr.io/${OWNER}/ahc-app=ghcr.io/${OWNER}/ahc-app:sha-${{ github.sha }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/home/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image tag change to commit."
            exit 0
          fi
          git commit -m "chore(deploy): bump ahc-app to sha-${{ github.sha }} [skip ci]"
          git push

  deploy-workflow:
    name: Submit deploy-smoke Argo Workflow
    runs-on: ubuntu-latest
    needs: bump
    # Self-disabled until an Argo Server is reachable from CI (self-hosted
    # runner or tunnel). ArgoCD auto-sync remains the primary deploy path.
    if: github.event_name == 'push' && vars.ARGO_SERVER_URL != ''
    steps:
      - name: Submit workflow via Argo Server API
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.ARGO_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ vars.ARGO_SERVER_URL }}/api/v1/workflows/argo/submit" \
            -d '{
              "resourceKind": "WorkflowTemplate",
              "resourceName": "ahc-deploy-smoke",
              "submitOptions": {
                "parameters": ["image-tag=sha-${{ github.sha }}"]
              }
            }'
