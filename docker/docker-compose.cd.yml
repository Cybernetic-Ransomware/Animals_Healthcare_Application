services:
  web:
    image: ghcr.io/cybernetic-ransomware/ahc-app:${APP_IMAGE_TAG:-prod}
    pull_policy: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ahc

  queue:
    image: ghcr.io/cybernetic-ransomware/ahc-app:${APP_IMAGE_TAG:-prod}
    pull_policy: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ahc

  celery_beat:
    image: ghcr.io/cybernetic-ransomware/ahc-app:${APP_IMAGE_TAG:-prod}
    pull_policy: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: ahc

  watchtower:
    # containrrr/watchtower archived 2025-12-17; nicholas-fedor/watchtower is the maintained fork, same label namespace and flags.
    image: ghcr.io/nicholas-fedor/watchtower:1.22.1
    command: --label-enable --cleanup --rolling-restart --interval 300 --scope ahc
    environment:
      DOCKER_API_VERSION: "1.41"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker:/root/.docker:ro
    networks:
      - ahc_net
    restart: unless-stopped
